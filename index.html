<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="EasyGame - 精选H5小游戏合集">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="format-detection" content="telephone=no">
    <title>EasyGame - 游戏中心</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            touch-action: manipulation;
        }

        /* 动态背景装饰 */
        body::before {
            content: '';
            position: absolute;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: moveBackground 20s linear infinite;
            z-index: 0;
        }

        @keyframes moveBackground {
            0% {
                transform: translate(0, 0);
            }
            100% {
                transform: translate(50px, 50px);
            }
        }

        .container {
            max-width: 1200px;
            width: 100%;
            position: relative;
            z-index: 1;
            padding: 0 10px;
        }

        /* 头部标题 */
        .header {
            text-align: center;
            margin-bottom: 50px;
            animation: fadeInDown 0.8s ease;
        }

        .header h1 {
            color: #fff;
            font-size: 3.5rem;
            font-weight: 700;
            text-shadow: 0 4px 20px rgba(0,0,0,0.3);
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        .header .logo {
            display: inline-block;
            margin-bottom: 20px;
            animation: bounce 2s ease infinite;
        }

        .header p {
            color: rgba(255,255,255,0.9);
            font-size: 1.2rem;
            font-weight: 300;
            letter-spacing: 1px;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-10px);
            }
        }

        /* 游戏卡片容器 */
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
            padding: 20px 0;
            max-width: 800px;
            margin: 0 auto;
        }

        @media (min-width: 769px) {
            .games-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        /* 游戏卡片 */
        .game-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 40px 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
            position: relative;
            overflow: hidden;
            animation: fadeInUp 0.8s ease;
            text-decoration: none;
            display: block;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }

        .game-card:nth-child(1) {
            animation-delay: 0.1s;
        }

        .game-card:nth-child(2) {
            animation-delay: 0.2s;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .game-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transition: left 0.5s;
        }



        @media (hover: hover) and (pointer: fine) {
            .game-card:hover {
                transform: translateY(-10px) scale(1.02);
                box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            }

            .game-card:hover::before {
                left: 100%;
            }

            .game-card:hover .game-icon {
                transform: rotate(360deg) scale(1.1);
            }
        }

        /* 移动端点击效果 */
        @media (hover: none) {
            .game-card:active {
                transform: scale(0.98);
                box-shadow: 0 5px 20px rgba(0,0,0,0.2);
            }
        }

        /* 游戏图标 */
        .game-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: transform 0.3s ease;
        }



        .game-icon svg {
            width: 100%;
            height: 100%;
        }

        /* 游戏信息 */
        .game-info {
            text-align: center;
        }

        .game-name {
            font-size: 1.8rem;
            color: #333;
            font-weight: 700;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        .game-description {
            color: #666;
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .play-button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-block;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        @media (hover: hover) and (pointer: fine) {
            .play-button:hover {
                transform: scale(1.05);
                box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
            }
        }

        @media (hover: none) {
            .play-button:active {
                transform: scale(0.95);
            }
        }

        /* 页脚 */
        .footer {
            text-align: center;
            margin-top: 60px;
            color: rgba(255,255,255,0.8);
            font-size: 0.9rem;
            animation: fadeIn 1.5s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        /* 平板设备 */
        @media (max-width: 1024px) and (min-width: 769px) {
            .header h1 {
                font-size: 3rem;
            }

            .games-grid {
                gap: 25px;
            }
        }

        /* 移动端优化 */
        @media (max-width: 768px) {
            body {
                padding: 15px 10px;
            }

            .header {
                margin-bottom: 30px;
            }

            .header h1 {
                font-size: 2.5rem;
            }

            .header p {
                font-size: 1rem;
            }

            .header .logo svg {
                width: 60px;
                height: 60px;
            }

            .games-grid {
                grid-template-columns: 1fr;
                gap: 20px;
                max-width: 100%;
            }

            .game-card {
                padding: 35px 25px;
            }

            .game-icon {
                width: 70px;
                height: 70px;
            }

            .game-name {
                font-size: 1.6rem;
            }

            .game-description {
                font-size: 0.95rem;
            }

            .play-button {
                padding: 10px 25px;
                font-size: 0.95rem;
            }

            .footer {
                margin-top: 40px;
                font-size: 0.85rem;
            }
        }

        /* 小屏手机优化 */
        @media (max-width: 480px) {
            .header h1 {
                font-size: 2rem;
            }

            .header p {
                font-size: 0.9rem;
            }

            .game-card {
                padding: 30px 20px;
            }

            .game-icon {
                width: 60px;
                height: 60px;
            }

            .game-name {
                font-size: 1.4rem;
            }

            .game-description {
                font-size: 0.9rem;
            }
        }

        /* 横屏适配 */
        @media (max-height: 600px) and (orientation: landscape) {
            body {
                padding: 10px;
            }

            .header {
                margin-bottom: 20px;
            }

            .header h1 {
                font-size: 2rem;
            }

            .header .logo {
                margin-bottom: 10px;
            }

            .games-grid {
                gap: 15px;
            }

            .footer {
                margin-top: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 头部 -->
        <div class="header">
            <div class="logo">
                <svg width="80" height="80" viewBox="0 0 100 100">
                    <circle cx="50" cy="50" r="45" fill="#fff" opacity="0.2"/>
                    <circle cx="50" cy="50" r="35" fill="#fff" opacity="0.3"/>
                    <path d="M50 20 L60 40 L80 45 L65 60 L68 80 L50 70 L32 80 L35 60 L20 45 L40 40 Z" fill="#fff"/>
                </svg>
            </div>
            <h1>🎮 EasyGame</h1>
            <p>精选H5小游戏 · 轻松畅玩</p>
        </div>

        <!-- 游戏列表 -->
        <div class="games-grid">
            <!-- EasyFly 游戏卡片 -->
            <a href="https://hanxhan000.github.io/EasyFly" class="game-card" target="_blank">
                <div class="game-icon">
                    <svg viewBox="0 0 100 100">
                        <defs>
                            <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" style="stop-color:#4facfe;stop-opacity:1" />
                                <stop offset="100%" style="stop-color:#00f2fe;stop-opacity:1" />
                            </linearGradient>
                        </defs>
                        <circle cx="50" cy="50" r="48" fill="url(#grad1)"/>
                        <!-- 飞机图标 -->
                        <path d="M50 25 L55 35 L70 38 L75 45 L60 48 L58 60 L50 65 L42 60 L40 48 L25 45 L30 38 L45 35 Z" fill="#fff"/>
                        <circle cx="50" cy="40" r="4" fill="#667eea"/>
                        <path d="M30 55 L35 58 L40 56 L38 52 Z" fill="#fff" opacity="0.8"/>
                        <path d="M70 55 L65 58 L60 56 L62 52 Z" fill="#fff" opacity="0.8"/>
                    </svg>
                </div>
                <div class="game-info">
                    <h2 class="game-name">✈️ EasyFly</h2>
                    <p class="game-description">驾驶小飞机穿越障碍，考验你的反应速度和操作技巧！</p>
                    <span class="play-button">立即游玩</span>
                </div>
            </a>

            <!-- Snake 游戏卡片 -->
            <a href="https://hanxhan000.github.io/SnakeGame" class="game-card" target="_blank">
                <div class="game-icon">
                    <svg viewBox="0 0 100 100">
                        <defs>
                            <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" style="stop-color:#43e97b;stop-opacity:1" />
                                <stop offset="100%" style="stop-color:#38f9d7;stop-opacity:1" />
                            </linearGradient>
                        </defs>
                        <circle cx="50" cy="50" r="48" fill="url(#grad2)"/>
                        <!-- 贪吃蛇图标 -->
                        <path d="M30 50 Q35 40 45 40 Q55 40 60 45 Q65 50 65 60 Q65 70 55 70 Q45 70 40 65" 
                              stroke="#fff" stroke-width="8" fill="none" stroke-linecap="round"/>
                        <circle cx="60" cy="47" r="3" fill="#fff"/>
                        <circle cx="56" cy="45" r="2" fill="#333"/>
                        <!-- 食物 -->
                        <circle cx="35" cy="65" r="4" fill="#ff6b6b"/>
                    </svg>
                </div>
                <div class="game-info">
                    <h2 class="game-name">🐍 Snake</h2>
                    <p class="game-description">经典贪吃蛇游戏，吃掉食物成长，挑战最高分！</p>
                    <span class="play-button">立即游玩</span>
                </div>
            </a>

            <!-- Tetris 游戏卡片 -->
            <a href="https://hanxhan000.github.io/tetris/" class="game-card" target="_blank" rel="noopener noreferrer" aria-label="俄罗斯方块（Tetris）">
                <div class="game-icon">
                    <svg viewBox="0 0 100 100">
                        <defs>
                            <linearGradient id="grad3" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" style="stop-color:#ff9a9e;stop-opacity:1" />
                                <stop offset="100%" style="stop-color:#fad0c4;stop-opacity:1" />
                            </linearGradient>
                        </defs>
                        <circle cx="50" cy="50" r="48" fill="url(#grad3)"/>
                        <!-- 俄罗斯方块图标 -->
                        <rect x="30" y="35" width="14" height="14" fill="#fff" rx="3" ry="3"/>
                        <rect x="44" y="35" width="14" height="14" fill="#fff" rx="3" ry="3"/>
                        <rect x="58" y="35" width="14" height="14" fill="#fff" rx="3" ry="3"/>
                        <rect x="58" y="49" width="14" height="14" fill="#fff" rx="3" ry="3"/>
                        <rect x="44" y="49" width="14" height="14" fill="#fff" rx="3" ry="3"/>
                    </svg>
                </div>
                <div class="game-info">
                    <h2 class="game-name">🧱 俄罗斯方块</h2>
                    <p class="game-description">经典俄罗斯方块，旋转落块消除行，支持键盘与触控。</p>
                    <span class="play-button">立即游玩</span>
                </div>
            </a>
        </div>

        <!-- 页脚 -->
        <div class="footer">
            <p>🎯 更多精彩游戏，敬请期待！</p>
            <p style="margin-top: 10px; font-size: 0.8rem;">© 2025 EasyGame. Made with ❤️</p>
        </div>
    </div>
</body>
</html>
